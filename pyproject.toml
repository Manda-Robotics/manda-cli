[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "manda-cli"
version = "0.1.0"
description = "Command-line client for Manda: share, verify and analyze robot policy evaluations"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Manda Robotics" }]
dependencies = []

[project.optional-dependencies]
dashboard = [
  "h5py>=3.11",
  "numpy>=2.0",
]
analysis = [
  "h5py>=3.11",
  "numpy>=2.0",
  "pyarrow>=16.0",
]
dev = [
  "pytest>=8.3",
  "ruff>=0.14",
]
all = [
  "h5py>=3.11",
  "numpy>=2.0",
  "pyarrow>=16.0",
]

[project.scripts]
manda = "manda_cli.cli:main"
robot-audit = "manda_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/manda_cli"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
